<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#321828">
  <meta name="description" content="Venüs’ten Okur için modern, animasyonlu link sayfası.">
  <title>Venüs’ten Okur | Linkler</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      color-scheme: light;
      --ink: #321828;
      --plum: #5a2f49;
      --rose: #b95f78;
      --rose-deep: #8e3d5f;
      --lavender: #9d82a8;
      --paper: #fff8f2;
      --paper-soft: #f8ece8;
      --champagne: #d9a85f;
      --line: rgba(82, 43, 67, 0.16);
      --glass: rgba(255, 250, 246, 0.72);
      --shadow: 0 24px 80px rgba(63, 32, 51, 0.24);
      --card-shadow: 0 14px 34px rgba(75, 38, 61, 0.16);
      --radius: 26px;
      --fast: 220ms ease;
      --spring: 680ms cubic-bezier(.18, .9, .24, 1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #321828;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050308;
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: -20%;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255, 239, 207, 0.9) 0 1px, transparent 1.8px),
        radial-gradient(circle, rgba(217, 168, 95, 0.66) 0 1px, transparent 1.7px);
      background-size: 94px 94px, 146px 146px;
      opacity: 0.5;
      animation: drift 18s linear infinite;
      mix-blend-mode: screen;
    }

    body::after {
      background-size: 160px 160px, 220px 220px;
      opacity: 0.28;
      animation-duration: 26s;
      animation-direction: reverse;
    }

    a {
      color: inherit;
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at center 68%, rgba(251, 218, 181, 0.9), transparent 30%),
        linear-gradient(145deg, #2c1726, #6d4358 52%, #f2d4ce);
      transition: opacity 820ms ease, visibility 820ms ease;
    }

    .loader.is-hidden {
      opacity: 0;
      visibility: hidden;
    }

    .book {
      position: relative;
      width: 220px;
      height: 300px;
      perspective: 1200px;
      filter: drop-shadow(0 26px 32px rgba(36, 18, 29, 0.34));
    }

    .book::before {
      content: "";
      position: absolute;
      inset: 14px -10px 10px 16px;
      border-radius: 8px 22px 22px 8px;
      background:
        repeating-linear-gradient(90deg, #fffaf5 0 7px, #f2ded4 7px 8px);
      box-shadow: inset -16px 0 24px rgba(64, 36, 50, 0.1);
    }

    .cover {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: 28px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px 24px 24px 8px;
      background:
        linear-gradient(90deg, rgba(64, 28, 48, 0.45), transparent 18%),
        radial-gradient(circle at 70% 28%, rgba(255, 232, 192, 0.42), transparent 26%),
        linear-gradient(145deg, #6f3b58, #b87388);
      color: #fff8f2;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 1450ms cubic-bezier(.5, .02, .18, 1);
    }

    .cover::after {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(255, 237, 200, 0.54);
      border-radius: 6px 18px 18px 6px;
    }

    .book.is-open .cover {
      transform: rotateY(-142deg);
    }

    .cover-title {
      position: relative;
      z-index: 1;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2rem;
      line-height: 1.08;
      letter-spacing: 0;
      text-shadow: 0 2px 10px rgba(31, 15, 25, 0.28);
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(100%, 980px);
      padding: 26px;
    }

    .stage {
      position: relative;
      min-height: min(860px, calc(100vh - 52px));
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(310px, 430px);
      gap: clamp(24px, 5vw, 64px);
      align-items: center;
      padding: clamp(24px, 5vw, 58px);
      border: 1px solid rgba(255, 255, 255, 0.34);
      border-radius: 36px;
      background:
        radial-gradient(circle at 72% 42%, rgba(190, 79, 153, 0.2), transparent 35%),
        linear-gradient(120deg, rgba(255, 249, 244, 0.14), rgba(255, 249, 244, 0.58)),
        rgba(5, 3, 8, 0.72);
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px);
      overflow: hidden;
      opacity: 0;
      transform: translateY(18px) scale(0.985);
      transition: opacity 900ms ease, transform 900ms ease;
    }

    .stage.is-ready {
      opacity: 1;
      transform: none;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(92, 52, 73, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(92, 52, 73, 0.035) 1px, transparent 1px);
      background-size: 26px 26px;
      mask-image: radial-gradient(circle at center, black, transparent 72%);
      pointer-events: none;
    }

    .stage::after {
      content: "";
      position: absolute;
      left: 4%;
      right: 4%;
      bottom: -74px;
      height: 160px;
      background:
        radial-gradient(ellipse at center, rgba(255, 233, 190, 0.72), transparent 62%);
      filter: blur(6px);
      pointer-events: none;
    }

    .venus-video-wrap {
      position: absolute;
      z-index: 0;
      width: clamp(300px, 42vw, 540px);
      aspect-ratio: 1;
      right: clamp(-178px, -10vw, -72px);
      top: clamp(34px, 9vw, 112px);
      border-radius: 50%;
      background: #050308;
      box-shadow:
        0 0 78px rgba(190, 79, 153, 0.22),
        0 30px 110px rgba(0, 0, 0, 0.5);
      opacity: 0.86;
      overflow: hidden;
      pointer-events: none;
    }

    .venus-video-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: inherit;
      background:
        radial-gradient(circle at center, transparent 42%, rgba(5, 3, 8, 0.12) 58%, rgba(5, 3, 8, 0.86) 79%),
        radial-gradient(circle at 26% 19%, rgba(255, 221, 238, 0.24), transparent 28%);
    }

    .venus-video-wrap::after {
      content: "";
      position: absolute;
      inset: -10%;
      z-index: 3;
      border-radius: inherit;
      background-image:
        radial-gradient(circle, rgba(255, 175, 218, 0.92) 0 1px, transparent 1.7px),
        radial-gradient(circle, rgba(255, 102, 191, 0.72) 0 1px, transparent 1.8px);
      background-size: 46px 46px, 82px 82px;
      opacity: 0.62;
      animation: pinkDust 16s linear infinite;
      mix-blend-mode: screen;
    }

    .venus-video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: inherit;
      filter: saturate(1.1) contrast(1.06) brightness(0.9);
    }

    .brand-panel,
    .link-panel {
      position: relative;
      z-index: 1;
    }

    .brand-panel {
      align-self: stretch;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 560px;
      padding: 8px 0;
    }

    .profile-cluster {
      display: grid;
      justify-items: center;
      gap: 18px;
      text-align: center;
    }

    .portrait-ring {
      position: relative;
      width: clamp(136px, 18vw, 186px);
      aspect-ratio: 1;
      padding: 8px;
      border-radius: 50%;
      background:
        conic-gradient(from 210deg, rgba(217, 168, 95, 0.15), #d9a85f, rgba(255, 249, 244, 0.95), #b95f78, rgba(217, 168, 95, 0.15));
      box-shadow: 0 22px 52px rgba(70, 34, 56, 0.24);
      animation: halo 6s ease-in-out infinite;
    }

    .portrait-ring::before {
      content: "";
      position: absolute;
      inset: -15px;
      border: 1px solid rgba(217, 168, 95, 0.34);
      border-radius: inherit;
      animation: breathe 4.5s ease-in-out infinite;
    }

    .profile-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: 5px solid var(--paper);
      border-radius: inherit;
      background: linear-gradient(145deg, #6f3b58, #f0d8d0);
    }

    .fallback-mark {
      position: absolute;
      inset: 18px;
      display: grid;
      place-items: center;
      border-radius: inherit;
      background: linear-gradient(145deg, #f9ebe4, #fffaf5);
      color: var(--rose-deep);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 3.7rem;
      opacity: 0;
      pointer-events: none;
    }

    .profile-img.is-broken + .fallback-mark {
      opacity: 1;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3.1rem, 6vw, 5.7rem);
      line-height: 0.96;
      font-weight: 500;
      letter-spacing: 0;
      color: var(--ink);
      text-wrap: balance;
    }

    .handle {
      margin: 8px 0 0;
      color: var(--rose-deep);
      font-size: clamp(1.05rem, 2.1vw, 1.32rem);
      font-weight: 600;
    }

    .bio {
      max-width: 440px;
      margin: 22px auto 0;
      color: rgba(50, 24, 40, 0.76);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.14rem, 2.4vw, 1.48rem);
      line-height: 1.5;
    }

    .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: var(--champagne);
      margin-top: 8px;
    }

    .ornament::before,
    .ornament::after {
      content: "";
      width: 56px;
      height: 1px;
      background: currentColor;
      opacity: 0.72;
    }

    .open-book {
      position: relative;
      height: 190px;
      margin: 26px auto 0;
      width: min(100%, 520px);
      opacity: 0.96;
      display: grid;
      place-items: end center;
    }

    .open-book::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 26px;
      width: min(82vw, 450px);
      height: 38px;
      transform: translateX(-50%);
      background: radial-gradient(ellipse at center, rgba(74, 34, 54, 0.28), transparent 68%);
      filter: blur(7px);
    }

    .book-photo {
      position: absolute;
      left: 50%;
      bottom: 6px;
      width: min(76%, 310px);
      height: auto;
      transform: translateX(-50%);
      filter: drop-shadow(0 28px 22px rgba(20, 10, 17, 0.32));
    }

    .book-glow {
      position: absolute;
      left: 50%;
      bottom: 25px;
      width: 58%;
      height: 92px;
      transform: translateX(-50%);
      background: radial-gradient(ellipse at center, rgba(255, 165, 216, 0.38), rgba(255, 236, 187, 0.18) 36%, transparent 72%);
      filter: blur(14px);
      animation: glowPulse 3.8s ease-in-out infinite;
    }

    .link-panel {
      align-self: center;
      display: grid;
      gap: 14px;
      max-width: 430px;
      width: 100%;
    }

    .link-card {
      --brand: var(--rose);
      position: relative;
      min-height: 78px;
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr) 32px;
      align-items: center;
      gap: 16px;
      padding: 12px 16px 12px 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.68);
      border-radius: var(--radius);
      background:
        linear-gradient(110deg, rgba(255, 255, 255, 0.82), rgba(255, 246, 242, 0.55)),
        var(--glass);
      box-shadow: var(--card-shadow);
      text-decoration: none;
      opacity: 0;
      transform: translateY(24px) scale(0.985);
      transition: transform var(--fast), box-shadow var(--fast), border-color var(--fast), background var(--fast);
      backdrop-filter: blur(22px);
    }

    .link-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 18% 50%, color-mix(in srgb, var(--brand) 20%, transparent), transparent 26%),
        linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.44), transparent);
      opacity: 0;
      transform: translateX(-36%);
      transition: opacity var(--fast), transform 620ms ease;
    }

    .link-card::after {
      content: "";
      position: absolute;
      right: 58px;
      top: 19px;
      width: 76px;
      height: 42px;
      opacity: 0.16;
      background:
        linear-gradient(35deg, transparent 46%, rgba(90, 47, 73, 0.24) 47% 49%, transparent 50%),
        radial-gradient(circle at 24px 18px, transparent 10px, rgba(90, 47, 73, 0.2) 10px 11px, transparent 12px);
      mask-image: linear-gradient(90deg, transparent, black 30%, transparent);
    }

    .stage.is-ready .link-card {
      animation: revealLink 720ms var(--spring) forwards;
      animation-delay: var(--delay);
    }

    .link-card:hover,
    .link-card:focus-visible {
      transform: translateY(-4px) scale(1.012);
      border-color: rgba(217, 168, 95, 0.64);
      box-shadow: 0 18px 42px rgba(75, 38, 61, 0.24);
      outline: none;
    }

    .link-card:hover::before,
    .link-card:focus-visible::before {
      opacity: 1;
      transform: translateX(34%);
    }

    .link-card:hover .arrow,
    .link-card:focus-visible .arrow {
      transform: translateX(4px);
      color: var(--brand);
    }

    .icon {
      position: relative;
      z-index: 1;
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 19px;
      background: rgba(255, 248, 244, 0.76);
      box-shadow: inset 0 0 0 1px rgba(190, 79, 153, 0.14), 0 12px 24px rgba(190, 79, 153, 0.18);
    }

    .icon img {
      width: 31px;
      height: 31px;
      display: block;
      object-fit: contain;
    }

    .icon i {
      display: block;
      color: #be4f99;
      font-size: 1.9rem;
      line-height: 1;
    }

    .wattpad-letter {
      color: #be4f99;
      font-size: 2rem;
      font-weight: 900;
      line-height: 1;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .icon svg,
    .arrow svg {
      width: 26px;
      height: 26px;
      display: block;
      fill: currentColor;
    }

    .link-copy {
      position: relative;
      z-index: 1;
      min-width: 0;
    }

    .link-copy strong {
      display: block;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.2rem;
      font-weight: 500;
      color: var(--ink);
    }

    .link-copy span {
      display: block;
      margin-top: 3px;
      overflow: hidden;
      color: rgba(50, 24, 40, 0.58);
      font-size: 0.82rem;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .arrow {
      position: relative;
      z-index: 1;
      color: var(--champagne);
      transition: transform var(--fast), color var(--fast);
    }

    .footer {
      position: relative;
      z-index: 1;
      margin-top: 18px;
      color: rgba(50, 24, 40, 0.62);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.98rem;
      text-align: center;
    }

    @keyframes revealLink {
      0% {
        opacity: 0;
        filter: blur(9px);
        transform: translateY(24px) scale(0.985);
      }
      100% {
        opacity: 1;
        filter: blur(0);
        transform: none;
      }
    }

    @keyframes drift {
      from {
        transform: translate3d(0, 0, 0) rotate(0deg);
      }
      to {
        transform: translate3d(30px, -30px, 0) rotate(1deg);
      }
    }

    @keyframes halo {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-7px);
      }
    }

    @keyframes breathe {
      0%, 100% {
        opacity: 0.36;
        transform: scale(0.96);
      }
      50% {
        opacity: 0.84;
        transform: scale(1.04);
      }
    }

    @keyframes glowPulse {
      0%, 100% {
        opacity: 0.72;
        transform: translateX(-50%) scaleX(0.92);
      }
      50% {
        opacity: 1;
        transform: translateX(-50%) scaleX(1.08);
      }
    }

    @keyframes pinkDust {
      from {
        transform: translate3d(0, 0, 0) rotate(0deg);
      }
      to {
        transform: translate3d(16px, -20px, 0) rotate(2deg);
      }
    }

    @media (max-width: 820px) {
      body {
        place-items: start center;
      }

      .shell {
        padding: 14px;
      }

      .stage {
        min-height: calc(100vh - 28px);
        grid-template-columns: 1fr;
        gap: 18px;
        padding: 26px 16px 22px;
        border-radius: 30px;
      }

      .venus-video-wrap {
        width: 290px;
        right: -150px;
        top: 54px;
        opacity: 0.58;
      }

      .brand-panel {
        min-height: auto;
        justify-content: start;
      }

      h1 {
        font-size: clamp(2.52rem, 12vw, 4.15rem);
      }

      .bio {
        margin-top: 14px;
        font-size: 1.08rem;
      }

      .open-book {
        height: 100px;
        margin-top: 10px;
      }

      .book-photo {
        width: min(68%, 230px);
      }

      .book-glow {
        bottom: 24px;
        height: 82px;
      }

      .link-panel {
        gap: 11px;
      }

      .link-card {
        min-height: 68px;
        grid-template-columns: 50px minmax(0, 1fr) 28px;
        gap: 12px;
        border-radius: 22px;
      }

      .icon {
        width: 50px;
        height: 50px;
        border-radius: 17px;
      }

      .icon img {
        width: 27px;
        height: 27px;
      }

      .icon i {
        font-size: 1.66rem;
      }

      .wattpad-letter {
        font-size: 1.76rem;
      }

      .icon svg,
      .arrow svg {
        width: 23px;
        height: 23px;
      }

      .link-copy strong {
        font-size: 1.08rem;
      }
    }

    @media (max-width: 380px) {
      .stage {
        padding-inline: 12px;
      }

      .link-copy span {
        font-size: 0.76rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 1ms !important;
      }

      .loader {
        display: none;
      }

      .stage,
      .link-card {
        opacity: 1;
        transform: none;
        filter: none;
      }
    }
  </style>
</head>
<body>
  <div class="loader" id="intro-loader" aria-hidden="true">
    <div class="book" id="book-anim">
      <div class="cover">
        <div class="cover-title">Venüs’ten<br>Okur</div>
      </div>
    </div>
  </div>

  <main class="shell">
    <section class="stage" id="main-content" aria-label="Venüs’ten Okur bağlantıları">
      <div class="venus-video-wrap" aria-hidden="true">
        <video class="venus-video" autoplay muted loop playsinline preload="metadata" poster="https://svs.gsfc.nasa.gov/vis/a020000/a020300/a020308/VenusEvoSeq01to03_UDH_21_9_ProRes.00001_print.jpg">
          <source src="assets/venus-rotation.mp4" type="video/mp4">
          <source src="https://svs.gsfc.nasa.gov/vis/a020000/a020300/a020308/VenusEvoSeq01to03_21_9_1080.mp4" type="video/mp4">
        </video>
      </div>
      <div class="brand-panel">
        <div class="profile-cluster">
          <div class="portrait-ring" aria-hidden="true">
            <img class="profile-img" src="https://iili.io/frnYibf.jpg" alt="Venüs’ten Okur profil görseli">
            <div class="fallback-mark">V</div>
          </div>

          <div>
            <div class="ornament" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
                <path d="M12 3.5c1.5 3.8 3.2 5.5 7 7-3.8 1.5-5.5 3.2-7 7-1.5-3.8-3.2-5.5-7-7 3.8-1.5 5.5-3.2 7-7Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
              </svg>
            </div>
            <h1>Venüs’ten Okur</h1>
            <p class="handle">@venustenokur</p>
            <p class="bio">Kitaplar, notlar ve iç sesler</p>
          </div>
        </div>

        <div class="open-book" aria-hidden="true">
          <div class="book-glow"></div>
          <img class="book-photo" src="assets/open-book.png" alt="" onerror="this.onerror=null;this.src='https://upload.wikimedia.org/wikipedia/commons/e/ed/Open_book_01.png';">
        </div>
      </div>

      <nav class="link-panel" aria-label="Sosyal medya bağlantıları">
        <a class="link-card" style="--delay: 120ms; --brand: #e64b5f;" href="https://youtube.com/@venustenokur" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">
            <i class="fa-brands fa-youtube"></i>
          </span>
          <span class="link-copy"><strong>YouTube</strong><span>youtube.com/@venustenokur</span></span>
          <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12h13m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>

  <script>
    const loader = document.querySelector("#intro-loader");
    const book = document.querySelector("#book-anim");
    const stage = document.querySelector("#main-content");
    const profileImage = document.querySelector(".profile-img");

    const showContent = () => {
      stage.classList.add("is-ready");
      document.body.style.overflow = "auto";
    };

    window.addEventListener("load", () => {
      window.setTimeout(() => book.classList.add("is-open"), 360);
      window.setTimeout(() => loader.classList.add("is-hidden"), 1650);
      window.setTimeout(showContent, 1980);
    });

    profileImage.addEventListener("error", () => {
      profileImage.classList.add("is-broken");
      profileImage.alt = "Profil görseli yüklenemedi";
    });

    document.querySelectorAll(".link-card").forEach((card) => {
      card.addEventListener("pointermove", (event) => {
        const rect = card.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width - 0.5) * 6;
        const y = ((event.clientY - rect.top) / rect.height - 0.5) * -6;
        card.style.transform = `translateY(-4px) scale(1.012) rotateX(${y}deg) rotateY(${x}deg)`;
      });

      card.addEventListener("pointerleave", () => {
        card.style.transform = "";
      });
    });
  </script>
